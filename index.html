<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skate Runner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Skate Runner 🛹</h1>
  <p>Pressione <b>Barra de Espaço</b> ou toque na tela para pular!</p>

  <div id="game-container">
    <div id="background-city"></div>
    <div id="player"></div>
    
    <div id="game-over-screen">
      <div>GAME OVER</div>
      <div style="font-size: 14px; margin-top: 10px;">Pressione Espaço para reiniciar</div>
    </div>
  </div>

  <div id="score-board">Pontuação: <span id="score">0</span></div>

  <script src="script.js"></script>
</body>
</html>
